services:
  - type: web
    name: empowered-compass
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    # NOTE: the API origin is deliberately NOT configurable here. Vite does not
    # inject envVars into import.meta.env during the Render build (see f2fc6b6),
    # so src/lib/auth.js hardcodes API_BASE. That file is the only source of
    # truth for the API host — do not re-add a VITE_API_URL key.
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NPM_TOKEN
        sync: false  # Set in Render dashboard — GitHub PAT with read:packages scope
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
