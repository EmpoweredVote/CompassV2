    <script>
      // Resolve the theme before first paint, in the same order as ThemeProvider — the cookie
      // is the cross-app truth (.empowered.vote) and must be read here too, or the first paint
      // ignores the choice the visitor made in the app they arrived from and flashes.
      (function () {
        var m = document.cookie.match(/(?:^|;\s*)ev_theme=([^;]+)/);
        var s = m ? m[1] : null;
        try {
          if (!s) {
            s = localStorage.getItem('ev:color-scheme');
            if (!s) {
              var legacy = localStorage.getItem('compass_dark_mode');
              if (legacy !== null) s = legacy === 'true' ? 'dark' : 'light';
            }
            if (s) {
              var d = new Date();
              d.setFullYear(d.getFullYear() + 1);
              document.cookie = 'ev_theme=' + s + '; domain=.empowered.vote; path=/; expires=' + d.toUTCString() + '; SameSite=Lax';
            }
          }
        } catch (err) { /* best-effort: storage is unavailable, fall through to the dark default */ }
        // Dark unless the visitor chose light on an Empowered Vote site. The OS is deliberately
        // not consulted: a browser reports prefers-color-scheme: light when the OS has no
        // preference set at all, so reading it could not tell "never chose" apart from "chose
        // light", and every undecided visitor got a light page.
        if (s !== 'light') document.documentElement.classList.add('dark');
      })();
