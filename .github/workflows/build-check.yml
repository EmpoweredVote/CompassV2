name: Build check

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Errors block; warnings do not. The 17 remaining react-hooks/exhaustive-deps
    # warnings need individual judgment (mechanically adding deps to those effects
    # is a reliable way to create a render loop), so they are deliberately not
    # gated yet. Keep errors at zero — that is what makes this gate meaningful.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test:
    # The unit suite (vitest + jsdom). Added with the custom lens builder (#72),
    # which is also when the repo got its first unit tests at all — before that
    # the only automated coverage was `smoke`, which needs a browser, a dev
    # server, the live API and the ev-context broker.
    #
    # These are the rules that decide whether a user's compass gets written down
    # (src/lib/compassSync.js). They are pure functions precisely so they can be
    # checked in milliseconds without any of that, and an ungated test suite
    # rots — so gate it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  smoke:
    # 🔴 ONE SMOKE JOB AT A TIME, REPO-WIDE, AND THE KEY IS A CONSTANT.
    #
    # The workflow-level group above is keyed on `github.ref`, which supersedes
    # a branch's own earlier runs — the right behaviour, and no help here. Four
    # scenarios (`sharedAccount: true`) sign into the ONE test account and call
    # DELETE /compass/answers/me to establish a known starting state. The suite
    # serialises them into a single lane WITHIN a run; nothing serialised them
    # ACROSS runs, so two PRs with overlapping smoke jobs wiped each other's
    # seeded answers.
    #
    # It is not theoretical: two PRs pushed two minutes apart failed
    # `authed-hydrates-server-answers` with "12 on the server, but ended up
    # with 1" — the other run's reset, reported as a hydration bug. It passed
    # on re-run and locally, which is the worst shape a CI failure can take.
    #
    # The group name is a literal, with nothing branch- or run-specific in it,
    # because the resource being protected is one account shared by every run.
    # `cancel-in-progress: false` queues rather than kills: a smoke run that is
    # most of the way through a three-minute suite should finish.
    #
    # ⚠ THE COST, STATED. GitHub keeps at most one run PENDING per group, so a
    # third concurrent run cancels the second's wait. A cancelled check is
    # honest and re-runnable, which the silent wrong failure was not — but if
    # this repo starts running three smoke jobs at once routinely, the fix is a
    # second test account, not a longer queue.
    #
    # ⚠ IT DOES NOT COVER A LOCAL RUN. `npm run smoke` on a laptop is outside
    # this lock entirely, and the authed scenarios now detect that case and say
    # so rather than blaming the app — see `seedStillOnServer` in smoke/run.mjs.
    concurrency:
      group: smoke-shared-test-account
      cancel-in-progress: false

    # Drives the real app in headless Chrome and asserts the critical guest
    # paths still work. `build` only proves the app compiles — the #65 bug
    # compiled fine and silently deleted every answer on /calibrate.
    #
    # Hits the live API and the ev-context broker on purpose: the answer-loss
    # regression only reproduces when the broker actually echoes writes back.
    # The `preflight` scenario fails loudly if either is unreachable, so an
    # outage reads as "broker unreachable" rather than a silent pass.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22' # smoke/cdp.mjs uses the built-in WebSocket client
          cache: 'npm'
      - run: npm ci
      - name: Locate Chrome
        run: echo "CHROME_PATH=$(which google-chrome || which chromium-browser)" >> "$GITHUB_ENV"
      - run: npm run smoke
        env:
          # Optional: set these as repository secrets to run the authed
          # scenarios in CI. Without them those three scenarios skip and the
          # guest scenarios still run.
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
