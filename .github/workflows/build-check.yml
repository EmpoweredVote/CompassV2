name: Build check

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    # Errors block; warnings do not. The 17 remaining react-hooks/exhaustive-deps
    # warnings need individual judgment (mechanically adding deps to those effects
    # is a reliable way to create a render loop), so they are deliberately not
    # gated yet. Keep errors at zero — that is what makes this gate meaningful.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test:
    # The unit suite (vitest + jsdom). Added with the custom lens builder (#72),
    # which is also when the repo got its first unit tests at all — before that
    # the only automated coverage was `smoke`, which needs a browser, a dev
    # server, the live API and the ev-context broker.
    #
    # These are the rules that decide whether a user's compass gets written down
    # (src/lib/compassSync.js). They are pure functions precisely so they can be
    # checked in milliseconds without any of that, and an ungated test suite
    # rots — so gate it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  smoke:
    # Drives the real app in headless Chrome and asserts the critical guest
    # paths still work. `build` only proves the app compiles — the #65 bug
    # compiled fine and silently deleted every answer on /calibrate.
    #
    # Hits the live API and the ev-context broker on purpose: the answer-loss
    # regression only reproduces when the broker actually echoes writes back.
    # The `preflight` scenario fails loudly if either is unreachable, so an
    # outage reads as "broker unreachable" rather than a silent pass.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22' # smoke/cdp.mjs uses the built-in WebSocket client
          cache: 'npm'
      - run: npm ci
      - name: Locate Chrome
        run: echo "CHROME_PATH=$(which google-chrome || which chromium-browser)" >> "$GITHUB_ENV"
      - run: npm run smoke
        env:
          # Optional: set these as repository secrets to run the authed
          # scenarios in CI. Without them those two scenarios skip and the
          # guest scenarios still run.
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
